<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="lightBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#2196f3" />
    </linearGradient>
    <linearGradient id="darkBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d47a1" />
      <stop offset="100%" stop-color="#03045e" />
    </linearGradient>
  </defs>

  <!-- Outer Light Blue Ribbon -->
  <path d="M 20,75 Q 35,25 47,50 T 75,25" 
        fill="none" 
        stroke="url(#lightBlueGrad)" 
        stroke-width="10" 
        stroke-linecap="round" />

  <!-- Inner Dark Blue Ribbon -->
  <path d="M 30,75 Q 45,25 57,50 T 85,25" 
        fill="none" 
        stroke="url(#darkBlueGrad)" 
        stroke-width="10" 
        stroke-linecap="round" />

  <!-- Bottom-Left Dot -->
  <circle cx="20" cy="88" r="5" fill="#00e5ff" />

  <!-- Top-Right Dot -->
  <circle cx="85" cy="12" r="5" fill="#00e5ff" />
</svg>
